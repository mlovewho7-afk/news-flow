name: Fetch News

on:
  # 평소엔 로컬 Mac의 launchd가 5분마다 workflow_dispatch로 직접 트리거한다(지연 없음).
  # 이 schedule은 Mac이 꺼져있거나 잠들어 있을 때를 위한 백업일 뿐이다 — GitHub의
  # 내장 schedule 트리거는 짧은 간격일수록 수 시간씩 지연되는 게 실측으로 확인돼
  # (1분 설정에도 실제 3~7시간 간격), 정기 간격을 더 당겨도 해결되지 않는다.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: fetch-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python -m scripts.fetch_news

      - name: Commit and push if changed
        run: |
          if ! git diff --quiet -- data/news.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/news.json
            git commit -m "news: update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # 트리거 빈도가 올라가면서(5분 launchd + 1시간 백업 schedule) 두 실행이
            # 거의 동시에 fetch→commit까지 마친 뒤 push만 경합하는 경우가 실제로
            # 발생함(2026-10-08 확인) — concurrency 그룹이 있어도 이 경합을 못 막는
            # 경우가 있었으므로, push 거부 시 rebase 후 재시도한다.
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "push 실패($attempt/3) — 원격 최신으로 rebase 후 재시도"
              git fetch origin main
              git rebase origin/main
            done
          else
            echo "No new items, skipping commit"
          fi
